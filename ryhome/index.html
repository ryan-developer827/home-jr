<!-- Home v3.9: prepaint theme guard -->
<script>
(function(){
  try{
    if (localStorage.getItem('ryhome-v312-theme-defaulted') !== '1') {
      localStorage.setItem('site-theme-mode', 'auto');
      localStorage.setItem('ryhome-v312-theme-defaulted', '1');
    }
    var saved = localStorage.getItem('site-theme-mode') || 'auto';
    var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var light = saved === 'light' || (saved === 'auto' && !dark);
    var root = document.documentElement;
    root.classList.toggle('force-dark', dark);
    root.classList.toggle('force-light', light);
    root.dataset.themeMode = saved;
    root.dataset.effectiveTheme = dark ? 'dark' : 'light';
    root.style.backgroundColor = dark ? '#121212' : '#f4f6fa';
  }catch(e){}
})();
</script>

html.force-dark,html.force-dark body{background:#121212!important;color:#e0e0e0!important;}
html.force-light,html.force-light body{background:#f4f6fa!important;color:#172033!important;}

<style>

}
@media (prefers-color-scheme: dark) {

    --bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--muted:#a0a0a0;--line:#333333;

  }
  .toc-title, summary span { color: var(--text) !important; }
  ul { background-color: var(--card) !important; }
  .site-link { border-bottom: 1px dashed #333d4a !important; }
.site-link strong { color: #ffffff !important; }
  .count { background: #2d3748 !important; color: #a0aec0 !important; }
  #scrollTopBtn { border-color: #555555 !important; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

html.force-light {
  color-scheme: light !important;
  --bg:#f4f6fa; --card:#fff; --text:#172033; --muted:#667085; --line:#e5e7eb;
  --chip:#eef4ff; --chipText:#174ea6; --soft:#f8fafc;
  --btn-bg:#fff; --btn-text:#172033;
}
html.force-light body { background: #f4f6fa !important; color: #172033 !important; }

html.force-light .toolbar-card { background-color: #ffffff !important; border-color: #e5e7eb !important; }
html.force-light .toc, html.force-light summary, html.force-light details.category, html.force-light ul { background-color: #ffffff !important; border-color: #e5e7eb !important; }
html.force-light .toc-title { color: #111827 !important; }
html.force-light summary span { color: #172033 !important; }
html.force-light .site-link { border-bottom: 1px dashed #edf0f5 !important; }

html.force-dark {
  color-scheme: dark !important;
  --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --muted:#a0a0a0; --line:#333333;
  --chip:#1f293d; --chipText:#8ab4f8; --soft:#1a1a1a;
  --btn-bg:#2d2d2d; --btn-text:#ffffff;
}
html.force-dark body { background: #121212 !important; color: #e0e0e0 !important; }
html.force-dark button { background: #2d2d2d !important; color: #ffffff !important; }
html.force-dark .toolbar-card { background-color: #1e1e1e !important; border-color: #333333 !important; }
html.force-dark .toc, html.force-dark summary, html.force-dark details.category, html.force-dark ul { background-color: #1e1e1e !important; border-color: #333333 !important; }
html.force-dark .toc-title, html.force-dark summary span { color: #e0e0e0 !important; }
html.force-dark .site-link { border-bottom: 1px dashed #333d4a !important; }
html.force-dark .site-link strong { color: #ffffff !important; }
html.force-dark .count { background: #2d3748 !important; color: #a0aec0 !important; }
html.force-dark .toc a { background: #24344d !important; color: #ffffff !important; }
html.force-dark .toc a.mid-toc { background: #1c3d27 !important; color: #6ed792 !important; border-color: #2b5c3b !important; }

button { background: var(--btn-bg) !important; color: var(--btn-text) !important; }
.toc, summary { background: var(--card) !important; }
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:20px 20px 18px}
.header-inner{max-width:1708px;margin:0 auto}
h1{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}
main{max-width:1708px;margin:22px auto 70px;padding:0 16px}

.toolbar-card{
  background:var(--card); border-radius:16px; padding:12px 18px;
  box-shadow:0 2px 12px rgba(16,24,40,.07); border:1px solid var(--line); margin-bottom:16px;
}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start}
button{padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:14px;font-weight:bold}
button:hover{background:#f7f8fb}

.toc-grid{display:grid;grid-template-columns:1fr;gap:14px;margin:0 0 14px}
.toc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 2px 12px rgba(16,24,40,.06)}
.toc-title{font-weight:800;margin-bottom:10px;color:#111827}
.toc a{display:inline-block;margin:4px 7px 4px 0;padding:7px 10px;background:var(--chip);border-radius:999px;color:var(--chipText);text-decoration:none;font-size:13px}
.toc a.mid-toc {
  display: block; margin: 12px 0 6px 0 !important; width: max-content; background: #e8f5ee; color: #166534;
  border: 1px solid #bbd9c8; font-size: 12px; font-weight: 850; letter-spacing: -.015em;
  box-shadow: 0 1px 4px rgba(22,101,52,.08); border-radius: 2px !important;
}
.toc a.mid-toc::before{content:'📂 ';font-weight:900;color:#2f855a}.toc a:hover{filter:brightness(.96);text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
details.category{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0;box-shadow:0 2px 12px rgba(16,24,40,.06);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:900;display:flex;justify-content:space-between;align-items:center;background:#fff;gap:10px}
summary::-webkit-details-marker{display:none}
.summary-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.count{font-size:12px;font-weight:700;color:#475569;background:#f1f5f9;border-radius:999px;padding:4px 8px;white-space:nowrap}
ul{margin:0;padding:0 18px 16px;columns:1;column-gap:0}
li{list-style:none;break-inside:avoid}
a{color:#0f4aa2;text-decoration:none}
a:hover{text-decoration:underline}
.site-link{display:block;padding:6px 0;border-bottom:1px dashed #edf0f5}
.site-link strong{font-weight:850; font-size:15px;}
.url{display:none}
.note{margin:18px 0 0;color:#667085;font-size:13px;line-height:1.6; text-align: center;}

.section-group{grid-column:1/-1; border:0;}
.section-content{padding-top:8px;}
.mid-divider{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:24px 0 4px;color:#17365d;font-size:18px;font-weight:950;letter-spacing:-.03em}
.mid-divider:before,.mid-divider:after{content:"";height:1px;background:linear-gradient(90deg,#17365d,#d9e3f0);flex:1;border-radius:999px}
.mid-divider span{background:#fff;border:1px solid #d5deeb;border-radius:999px;padding:7px 14px;box-shadow:0 3px 10px rgba(16,24,40,.06)}

@media(max-width:760px){
  header{padding:24px 16px} h1{font-size:24px} 
  .grid{grid-template-columns:1fr} ul{columns:1} 
}

#scrollTopBtn {
  display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99;
  width: 52px; height: 52px; background-color: var(--card); color: var(--text);
  border: 2px solid var(--navy); outline: none; cursor: pointer; border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: 14px; font-weight: bold;
  flex-direction: column; align-items: center; justify-content: center;
}
#scrollTopBtn:hover { filter: brightness(0.9); }

summary{font-size:calc(16px * var(--site-font-scale));}
.site-link strong{font-size:calc(15px * var(--site-font-scale));}

.toc-group{margin-bottom:10px}
.toc-main{display:inline-block;font-weight:900;margin-right:8px;color:inherit;text-decoration:none}
.section-group{grid-column:1/-1;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:0;overflow:hidden}

.section-content{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:14px}


/* V5: 목차 접기/펼치기 + 팝업/다크모드 보정 */

.toc-details:not([open]) > .toc-title::after{content:'펼치기';}

/* Home common header/page nav */

// 화면 모드 전환 기능
function toggleSettingsPopup() {
  const popup = document.getElementById('settingsPopup');
  const fontPopup = document.getElementById('fontPopup');
  if (fontPopup) fontPopup.style.display = 'none';
  popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
}
document.addEventListener('click', function(e) {
  const themePopup = document.getElementById('settingsPopup');
  const fontPopup = document.getElementById('fontPopup');
  const themeBtn = document.getElementById('settingsBtn');
  const fontBtn = document.getElementById('fontBtn');

  const clickedThemeArea = themePopup && (themePopup.contains(e.target) || e.target === themeBtn);
  const clickedFontArea = fontPopup && (fontPopup.contains(e.target) || e.target === fontBtn);

  if (themePopup && themePopup.style.display === 'block' && !clickedThemeArea) themePopup.style.display = 'none';
  if (fontPopup && fontPopup.style.display === 'block' && !clickedFontArea) fontPopup.style.display = 'none';
});
function changeThemeMode(mode) {
  localStorage.setItem('site-theme-mode', mode);
  applyThemeMode(mode);
}
function applyThemeMode(mode) {
  const rootHtml = document.documentElement;
  const effectiveMode = mode === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : mode;
  rootHtml.classList.toggle('force-light', effectiveMode === 'light');
  rootHtml.classList.toggle('force-dark', effectiveMode === 'dark');
  rootHtml.dataset.themeMode = mode;
  rootHtml.dataset.effectiveTheme = effectiveMode;
  document.querySelectorAll('#settingsPopup .theme-option').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.themeMode === mode);
    btn.setAttribute('aria-pressed', btn.dataset.themeMode === mode ? 'true' : 'false');
  });
}
document.addEventListener('DOMContentLoaded', function() {
  const savedMode = localStorage.getItem('site-theme-mode') || 'auto';
  applyThemeMode(savedMode);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem('site-theme-mode') || 'auto') === 'auto') applyThemeMode('auto');
    });
  }
});

}

  const [name,url]=item;
  const icon=faviconUrl(url);
  const img=icon ? `<img class="site-favicon" src="${safeAttr(icon)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('is-hidden')">` : '';
  return `<a class="site-link" href="${safeAttr(url)}" target="_blank" rel="noopener noreferrer"><span class="site-title">${img}<strong>${safeHtml(name)}</strong></span><span class="url">${safeHtml(url)}</span></a>`;
}

function tocHtml(items,prefix,map){
 let out='';
 let current=null;
 items.forEach(d=>{
   if(d.type==='divider'){
      if(current) out+='</div>';
      current=d.title;
      out+=`<div class="toc-group"><a class="toc-main mid-toc" href="#${slug(prefix,'mid-'+d.title)}">${safeHtml(d.title)}</a>`;
   }else{
      out+=`<a href="#${slug(prefix,d.cat)}">${map[d.cat]||'🔹'} ${safeHtml(d.cat)}</a>`;
   }
 });
 if(current) out+='</div>';
 return out;
}

function renderSection(items,prefix,map,container){
 let out='';

 items.forEach(d=>{
   if(d.type==='divider'){
      const dividerId = slug(prefix,'mid-'+d.title);
      out+=`<div class="mid-divider search-divider mid-divider-toggle" id="${dividerId}" data-section="${safeAttr(prefix)}" data-text="${safeAttr(String(d.title||'').toLowerCase())}" role="button" tabindex="0" aria-expanded="true" title="눌러서 접기/펼치기"><span>📂 ${safeHtml(d.title)}<span class="mid-toggle-icon">▾</span></span></div>`;
   }else{
      out+=`<details class="category" id="${slug(prefix,d.cat)}" open>
      <summary><span>${label(d.cat,map)}</span></summary>
      <ul>${d.links.map(x=>`<li>${linkHtml(x,d.cat)}</li>`).join('')}</ul>
      </details>`;
   }
 });

 container.innerHTML=out;
}

function render(){
  bookmarkToc.innerHTML = tocHtml(bookmarkData, 'bookmark', bookmarkEmoji);
  renderSection(bookmarkData, 'bookmark', bookmarkEmoji, bookmarkTree);
}

function findPreviousMidDivider(el){
  let prev = el ? el.previousElementSibling : null;
  while(prev){
    if(prev.matches && prev.matches('.mid-divider')) return prev;
    prev = prev.previousElementSibling;
  }
  return null;
}
function setMidDividerState(divider, expanded){
  if(!divider) return;
  divider.classList.toggle('is-collapsed', !expanded);
  divider.setAttribute('aria-expanded', String(expanded));
  const icon = divider.querySelector('.mid-toggle-icon');
  if(icon) icon.textContent = expanded ? '▾' : '▸';
  let next = divider.nextElementSibling;
  while(next && !next.matches('.mid-divider')){
    if(next.matches('details.category')){
      next.classList.toggle('collapsed-by-divider', !expanded);
    }
    next = next.nextElementSibling;
  }
}
function toggleMidDivider(divider){
  const expanded = divider.getAttribute('aria-expanded') !== 'false';
  setMidDividerState(divider, !expanded);
}
function expandParentMidDivider(el){
  const parentDivider = findPreviousMidDivider(el);
  if(parentDivider) setMidDividerState(parentDivider, true);
}
function expandAllMidDividers(scope=document){
  scope.querySelectorAll('.mid-divider').forEach(divider=>setMidDividerState(divider, true));
}
function collapseAllMidDividers(scope=document){
  scope.querySelectorAll('.mid-divider').forEach(divider=>setMidDividerState(divider, false));
}
function openAll(){
  expandAllMidDividers();
  document.querySelectorAll('details.category').forEach(d=>{d.classList.remove('collapsed-by-divider'); d.open=true;});
}
function closeAll(){
  collapseAllMidDividers();
  document.querySelectorAll('details.category').forEach(d=>d.open=false);
}

render();

document.addEventListener('click', function(e){
  const midToggle = e.target.closest('.mid-divider-toggle');
  if(!midToggle) return;
  e.preventDefault();
  toggleMidDivider(midToggle);
});
document.addEventListener('keydown', function(e){
  const midToggle = e.target.closest('.mid-divider-toggle');
  if(!midToggle) return;
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    toggleMidDivider(midToggle);
  }
});
</script>

<script>
/* Home v3.3: consistent popup toggling */
(function(){
  function popup(id){ return document.getElementById(id); }
  function show(el){ if(el) el.style.display='block'; }
  function hide(el){ if(el) el.style.display='none'; }
  function isOpen(el){ return !!el && el.style.display === 'block'; }

  window.toggleSettingsPopup = function(){
    const settings = popup('settingsPopup');
    const font = popup('fontPopup');
    const willOpen = !isOpen(settings);
    hide(font);
    if(settings) settings.style.display = willOpen ? 'block' : 'none';
  };

  window.toggleFontPopup = function(){
    const settings = popup('settingsPopup');
    const font = popup('fontPopup');
    const willOpen = !isOpen(font);
    hide(settings);
    if(font) font.style.display = willOpen ? 'block' : 'none';
  };

  document.addEventListener('click', function(e){
    const settings = popup('settingsPopup');
    const font = popup('fontPopup');
    const settingsBtn = document.getElementById('settingsBtn');
    const fontBtn = document.getElementById('fontBtn');

    const inSettings = settings && settings.contains(e.target);
    const inFont = font && font.contains(e.target);
    const onSettingsBtn = settingsBtn && (e.target === settingsBtn || settingsBtn.contains(e.target));
    const onFontBtn = fontBtn && (e.target === fontBtn || fontBtn.contains(e.target));

    if(!inSettings && !onSettingsBtn && isOpen(settings)) hide(settings);
    if(!inFont && !onFontBtn && isOpen(font)) hide(font);
  }, true);
})();
</script>


<script>
/* Home v3.8: popup alignment under each clicked setting button */
(function(){
  function byId(id){return document.getElementById(id);}
  function isOpen(el){return !!el && el.style.display === 'block';}
  function hide(el){if(el) el.style.display = 'none';}
  function placePopup(popup, btn){
    if(!popup || !btn) return;
    const anchor = document.querySelector('.ry-titlebar,.header-inner') || btn.offsetParent || document.body;
    const a = anchor.getBoundingClientRect();
    const b = btn.getBoundingClientRect();
    popup.style.position = 'absolute';
    popup.style.top = '100%';
    popup.style.left = 'auto';
    popup.style.right = Math.max(0, Math.round(a.right - b.right)) + 'px';
    popup.style.marginTop = '8px';
  }
  window.toggleSettingsPopup = function(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    const btn = byId('settingsBtn');
    const willOpen = !isOpen(settings);
    hide(font);
    if(settings){
      placePopup(settings, btn);
      settings.style.display = willOpen ? 'block' : 'none';
    }
  };
  window.toggleFontPopup = function(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    const btn = byId('fontBtn');
    const willOpen = !isOpen(font);
    hide(settings);
    if(font){
      placePopup(font, btn);
      font.style.display = willOpen ? 'block' : 'none';
    }
  };
  window.addEventListener('resize', function(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    if(isOpen(settings)) placePopup(settings, byId('settingsBtn'));
    if(isOpen(font)) placePopup(font, byId('fontBtn'));
  }, {passive:true});
})();
</script>


<script>
/* Home v3.10: cycle buttons instead of popups */
(function(){
  const THEME_ORDER = ['auto','light','dark'];
  const FONT_ORDER = [1,1.2,0.8];
  const EPS = 0.001;

  function byId(id){ return document.getElementById(id); }
  function normScale(v){
    const n = parseFloat(v);
    if(Number.isNaN(n)) return 1;
    if(n >= 1.05) return 1.2;
    if(n <= 0.95) return 0.8;
    return 1;
  }
  function percent(scale){ return Math.round(normScale(scale) * 100) + '%'; }
  function readTheme(){ return localStorage.getItem('site-theme-mode') || 'auto'; }
  function readScale(){ return normScale(localStorage.getItem('site-font-scale') || getComputedStyle(document.documentElement).getPropertyValue('--site-font-scale') || 1); }

  function hideLegacyPopups(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    if(settings) settings.style.display = 'none';
    if(font) font.style.display = 'none';
  }

  function refreshThemeButton(mode){
    const btn = byId('settingsBtn');
    if(!btn) return;
    const current = mode || readTheme();
    const labelMap = {auto:'시스템모드', light:'수동밝게모드', dark:'수동다크모드'};
    const iconMap = {auto:'💻', light:'☀️', dark:'🌙'};
    btn.textContent = iconMap[current] || iconMap.auto;
    btn.setAttribute('aria-label', '밝기설정: ' + (labelMap[current] || labelMap.auto));
    btn.setAttribute('title', '밝기설정: ' + (labelMap[current] || labelMap.auto));
    btn.dataset.themeMode = current;
  }

  function refreshFontButton(scale){
    const btn = byId('fontBtn');
    if(!btn) return;
    const p = percent(scale == null ? readScale() : scale);
    btn.textContent = 'Aa ' + p;
    btn.setAttribute('aria-label', '폰트크기설정: ' + p);
    btn.setAttribute('title', '폰트크기설정: ' + p);
    btn.dataset.fontScale = String(normScale(scale == null ? readScale() : scale));
  }

  function applyMode(mode){
    const next = THEME_ORDER.includes(mode) ? mode : 'auto';
    if(typeof window.applyThemeMode === 'function'){
      window.applyThemeMode(next);
    }else{
      const dark = next === 'dark' || (next === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const light = !dark;
      document.documentElement.classList.toggle('force-dark', dark);
      document.documentElement.classList.toggle('force-light', light);
      document.documentElement.dataset.themeMode = next;
      document.documentElement.dataset.effectiveTheme = dark ? 'dark' : 'light';
    }
    localStorage.setItem('site-theme-mode', next);
    refreshThemeButton(next);
    hideLegacyPopups();
  }

  function applyScale(scale){
    const next = normScale(scale);
    if(typeof window.setFontSize === 'function'){
      window.setFontSize(next);
    }else{
      document.documentElement.style.setProperty('--site-font-scale', next);
      localStorage.setItem('site-font-scale', next);
    }
    refreshFontButton(next);
    hideLegacyPopups();
  }

  window.toggleSettingsPopup = function(){
    const current = readTheme();
    const idx = Math.max(0, THEME_ORDER.indexOf(current));
    applyMode(THEME_ORDER[(idx + 1) % THEME_ORDER.length]);
  };

  window.toggleFontPopup = function(){
    const current = readScale();
    let idx = FONT_ORDER.findIndex(v => Math.abs(v - current) < EPS);
    if(idx < 0) idx = 0;
    applyScale(FONT_ORDER[(idx + 1) % FONT_ORDER.length]);
  };

  window.changeThemeMode = function(mode){ applyMode(mode); };
  window.changeFontSize = function(scale){ applyScale(scale); };

  function init(){
    hideLegacyPopups();
    applyMode(readTheme());
    applyScale(readScale());
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = () => {
      if(readTheme() === 'auto') applyMode('auto');
    };
    if(mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if(mq.addListener) mq.addListener(onSystemChange);
  }
})();
</script>
