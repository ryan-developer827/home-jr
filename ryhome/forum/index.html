<!-- Home v3.9: prepaint theme guard -->
<script>
(function(){
  try{
    if (localStorage.getItem('ryhome-v312-theme-defaulted') !== '1') {
      localStorage.setItem('site-theme-mode', 'auto');
      localStorage.setItem('ryhome-v312-theme-defaulted', '1');
    }
    var saved = localStorage.getItem('site-theme-mode') || 'auto';
    var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var light = saved === 'light' || (saved === 'auto' && !dark);
    var root = document.documentElement;
    root.classList.toggle('force-dark', dark);
    root.classList.toggle('force-light', light);
    root.dataset.themeMode = saved;
    root.dataset.effectiveTheme = dark ? 'dark' : 'light';
    root.style.backgroundColor = dark ? '#121212' : '#f4f6fa';
  }catch(e){}
})();
</script>
<style id="ry-prepaint-theme">
html.force-dark,html.force-dark body{background:#121212!important;color:#e0e0e0!important;}
html.force-light,html.force-light body{background:#f4f6fa!important;color:#172033!important;}
</style>

<style>
:root{
  --navy:#061a34;--navy2:#0b2a4f;--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--chip:#eef4ff;--chipText:#174ea6;--soft:#f8fafc;
  --btn-bg: #fff; --btn-text: #172033; /* 라이트모드 툴바/탑버튼 색상 */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--muted:#a0a0a0;--line:#333333;
    --chip:#1f293d;--chipText:#8ab4f8;--soft:#1a1a1a;
    --btn-bg: #2d2d2d; --btn-text: #ffffff;
  }

  /* 2번 해결: 다크모드 시 상단 목차(#) 및 📂 폴더 네모박스 글자 가독성 개선 */
  .toc a {
    background: #24344d !important;
    color: #9ec2ff !important;
  }
  .toc a.mid-toc {
    background: #1c3d27 !important;
    color: #6ed792 !important;
    border-color: #2b5c3b !important;
  }

  /* 3번 해결: 다크모드 시 흰색으로 남던 하위 그룹 박스들을 어둡게 강제 전환 */
  details.category, 
  details.category summary, 
  .quick-card, 
  .toc {
    background-color: var(--card) !important;
    border-color: var(--line) !important;
  }

  /* 다크모드 카테고리 제목 및 링크 텍스트 색상 최적화 */
  .toc-title, 
  summary span, 
  .quick-card h2 {
    color: var(--text) !important;
  }
  ul {
    background-color: var(--card) !important;
  }
  .site-link {
    border-bottom: 1px dashed #333d4a !important;
  }
  .site-link strong {
    color: #a3c5f7 !important;
  }
.count {
    background: #2d3748 !important;
    color: #a0aec0 !important;
  }
  /* 다크모드일 때는 흰색 계열 테두리로 버튼을 돋보이게 만듭니다 */
  #scrollTopBtn {
    border-color: #555555 !important;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

/* 테마 강제 고정용 클래스 규칙 */
html.force-light { color-scheme: light !important; }
html.force-light :root {
  --bg:#f4f6fa; --card:#fff; --text:#172033; --muted:#667085; --line:#e5e7eb; --chip:#eef4ff; --chipText:#174ea6; --soft:#f8fafc; --btn-bg: #fff; --btn-text: #172033;
}
html.force-light body { background: #f4f6fa !important; color: #172033 !important; }
html.force-light input { background: #ffffff !important; color: #172033 !important; border-color: #e5e7eb !important; }
html.force-light button { background: #ffffff !important; color: #172033 !important; }
html.force-light .search-card { background-color: #ffffff !important; border-color: #e5e7eb !important; }
html.force-light .toc, html.force-light summary, html.force-light details.category, html.force-light .quick-card, html.force-light ul { background-color: #ffffff !important; border-color: #e5e7eb !important; }
html.force-light .toc-title { color: #111827 !important; }
html.force-light summary span { color: #172033 !important; }
html.force-light .quick-card h2 { color: #000000 !important; }
html.force-light .site-link { border-bottom: 1px dashed #edf0f5 !important; }
html.force-light .site-link strong { color: #0f4aa2 !important; }
html.force-light .count { background: #f1f5f9 !important; color: #475569 !important; }
html.force-light .toc a { background: #eef4ff !important; color: #174ea6 !important; }
html.force-light .toc a.mid-toc { background: #e8f5ee !important; color: #166534 !important; border-color: #bbd9c8 !important; }
html.force-light #scrollTopBtn { border-color: var(--navy) !important; background-color: #ffffff !important; color: #172033 !important; }

html.force-dark { color-scheme: dark !important; }
html.force-dark :root {
  --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --muted:#a0a0a0; --line:#333333; --chip:#1f293d; --chipText:#8ab4f8; --soft:#1a1a1a; --btn-bg: #2d2d2d; --btn-text: #ffffff;
}
html.force-dark body { background: #121212 !important; color: #e0e0e0 !important; }
html.force-dark input { background: #2d2d2d !important; color: #ffffff !important; border-color: #333333 !important; }
html.force-dark button { background: #2d2d2d !important; color: #ffffff !important; }
html.force-dark .search-card { background-color: #1e1e1e !important; border-color: #333333 !important; }
html.force-dark .toc, html.force-dark summary, html.force-dark details.category, html.force-dark .quick-card, html.force-dark ul { background-color: #1e1e1e !important; border-color: #333333 !important; }
html.force-dark .toc-title, html.force-dark summary span, html.force-dark .quick-card h2 { color: #e0e0e0 !important; }
html.force-dark .site-link { border-bottom: 1px dashed #333d4a !important; }
html.force-dark .site-link strong { color: #a3c5f7 !important; }
html.force-dark .count { background: #2d3748 !important; color: #a0aec0 !important; }
html.force-dark .toc a { background: #24344d !important; color: #9ec2ff !important; }
html.force-dark .toc a.mid-toc { background: #1c3d27 !important; color: #6ed792 !important; border-color: #2b5c3b !important; }
html.force-dark .toc a.special-pink { background: #4a2828 !important; color: #ffb3b3 !important; }
html.force-dark #scrollTopBtn { border-color: #555555 !important; background-color: #1e1e1e !important; color: #e0e0e0 !important; }

/* 다크모드 상태이더라도 검색창(input)은 항상 화이트 배경과 어두운 글자색을 유지하도록 고정 */
input { background: #ffffff !important; color: #172033 !important; }
button { background: var(--btn-bg) !important; color: var(--btn-text) !important; }
.toc, summary { background: var(--card) !important; }
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:32px 20px 26px}
.header-inner{max-width:1708px;margin:0 auto}
h1{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}
.meta{color:#cbd5e1;font-size:14px;line-height:1.6}
main{max-width:1708px;margin:22px auto 70px;padding:0 16px}

/* [수정] 검색바 부들부들 떨리는 현상 제거를 위한 최적화 */
.search-card{
  background:var(--card);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:0 2px 12px rgba(16,24,40,.07);
  border:1px solid var(--line);
  margin-bottom:16px;
  
  /* position: sticky 적용 시 흔들림 방지를 위해 top을 0이 아닌 1px 여유를 주거나 고정 */
  position: sticky;
  top: -1px; 
  z-index: 100; /* 다른 요소보다 확실하게 위에 올라오도록 변경 */
}

.toolbar{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:260px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
button{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
button:hover{background:#f7f8fb}
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 14px}
.toc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 2px 12px rgba(16,24,40,.06)}
.toc-title{font-weight:800;margin-bottom:10px;color:#111827}
.toc-title.toc-toggle{
  display:block;
  width:100%;
  padding:0;
  margin:0 0 10px 0;
  border:0;
  border-radius:0;
  background:transparent !important;
  color:inherit !important;
  box-shadow:none;
  text-align:left;
  font:inherit;
  cursor:pointer;
}
.toc-title.toc-toggle:hover{text-decoration:none;filter:none;background:transparent !important}
.toc-toggle-icon{float:right;font-size:13px;opacity:.75;margin-left:8px}
.toc-body.is-collapsed{display:none!important}
.anchor-active{
  outline:3px solid rgba(14,165,233,.55) !important;
  outline-offset:4px;
  transition:outline-color .2s ease, box-shadow .2s ease;
  box-shadow:0 0 0 7px rgba(14,165,233,.10), 0 2px 12px rgba(16,24,40,.08) !important;
}
.toc a{display:inline-block;margin:4px 7px 4px 0;padding:7px 10px;background:var(--chip);border-radius:999px;color:var(--chipText);text-decoration:none;font-size:13px}
.toc a.mid-toc {
  display: block; /* 한 줄을 통째로 차지하여 자동으로 줄바꿈이 됩니다 */
  margin: 12px 0 6px 0 !important; /* 위아래 간격을 주어 가독성을 높입니다 */
  width: max-content; /* 글자 길이에 딱 맞게 박스 크기를 조절합니다 */
  background: #e8f5ee;
  color: #166534;
  border: 1px solid #bbd9c8;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: -.015em;
  box-shadow: 0 1px 4px rgba(22,101,52,.08);
  border-radius: 2px !important;
}
.toc a.mid-toc::before{content:'📂 ';font-weight:900;color:#2f855a}.toc a:hover{filter:brightness(.96);text-decoration:underline}
/* 포털/속보 전용 육각형 파스텔 핑크 박스 스타일 */
.toc a.special-pink {
  background: #ffebeb !important; /* 부드러운 파스텔 핑크 배경 */
  color: #c04848 !important; /* 다크모드 대응을 위한 차분한 딥핑크 글자색 */
  border: none !important;
  font-weight: 850 !important;
  box-shadow: 0 2px 6px rgba(192, 72, 72, 0.15) !important;
  
  /* 박스를 육각형 모양으로 깎아내는 마법의 코드 */
  clip-path: polygon(8% 0%, 92% 0%, 100% 50%, 92% 100%, 8% 100%, 0% 50%);
  padding: 7px 16px !important; /* 육각형 양끝 각진 부분 때문에 좌우 여백을 늘렸습니다 */
  border-radius: 0px !important; /* 육각형 표현을 위해 둥근 테두리 해제 */
}

/* 다크모드가 되었을 때 눈이 부시지 않도록 파스텔 핑크 톤 다운 */
@media (prefers-color-scheme: dark) {
  .toc a.special-pink {
    background: #4a2828 !important; /* 어두운 다크 파스텔 핑크 */
    color: #ffb3b3 !important; /* 밝은 파스텔 핑크 글자색 */
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3) !important;
  }
}
.quick-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 18px}
.quick-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:0 2px 12px rgba(16,24,40,.06)}
.quick-card h2{margin:0 0 12px;font-size:19px}
.quick-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
details.category{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0;box-shadow:0 2px 12px rgba(16,24,40,.06);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:900;display:flex;justify-content:space-between;align-items:center;background:#fff;gap:10px}
summary::-webkit-details-marker{display:none}
.summary-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.count{font-size:12px;font-weight:700;color:#475569;background:#f1f5f9;border-radius:999px;padding:4px 8px;white-space:nowrap}
ul{margin:0;padding:0 18px 16px;columns:1;column-gap:0}
li{list-style:none;break-inside:avoid}
a{color:#0f4aa2;text-decoration:none}
a:hover{text-decoration:underline}
.site-link{display:block;padding:6px 0;border-bottom:1px dashed #edf0f5}
.site-link strong{font-weight:850}
.feature{font-size:11px;color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:2px 6px;margin-left:4px;font-weight:750;white-space:nowrap}
.url{display:none!important;color:#7b8794;font-size:12px;margin-top:2px;word-break:break-all;font-weight:400}
.site-link, html.force-light .site-link, html.force-dark .site-link{border-bottom:0!important;text-decoration:none!important}
.site-link:hover, .site-link:hover *, html.force-light .site-link:hover, html.force-dark .site-link:hover{text-decoration:none!important}
.section-divider{display:flex;align-items:center;gap:20px;margin:46px 0 24px;color:#061a34;font-size:30px;font-weight:1000;letter-spacing:-.04em}
.section-divider:before,.section-divider:after{content:"";height:3px;background:linear-gradient(90deg,#061a34,#d6deea);flex:1;border-radius:999px}
.section-divider span{display:inline-block;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:12px 22px;box-shadow:0 5px 18px rgba(16,24,40,.10)}
.section-divider.news-divider{font-size:21px;margin:20px 0 14px;gap:14px}
.section-divider.news-divider:before,.section-divider.news-divider:after{height:2px}
.section-divider.news-divider span{padding:8px 16px}
.note{margin:18px 0 0;color:#667085;font-size:13px;line-height:1.6}
.footer{text-align:center;color:#7b8794;font-size:12px;margin-top:26px}

.mid-divider{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:#17365d;font-size:18px;font-weight:950;letter-spacing:-.03em}
.mid-divider:before,.mid-divider:after{content:"";height:1px;background:linear-gradient(90deg,#17365d,#d9e3f0);flex:1;border-radius:999px}
.mid-divider > span{background:#fff;border:1px solid #d5deeb;border-radius:999px;padding:7px 14px;box-shadow:0 3px 10px rgba(16,24,40,.06)}

.mid-divider-toggle{cursor:pointer;user-select:none}
.mid-divider-toggle:focus-visible{outline:3px solid rgba(14,165,233,.55);outline-offset:4px;border-radius:999px}
.mid-divider.is-collapsed > span{opacity:.88}
.mid-toggle-icon{display:inline-block;margin-left:8px;font-size:13px;opacity:.75}
.collapsed-by-divider{display:none!important}

/* 밝게 고정은 시스템 연동 상태가 밝을 때의 실제 라이트 색상과 동일하게 맞춤 */

  color-scheme:light!important;
  --navy:#061a34;--navy2:#0b2a4f;--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--chip:#eef4ff;--chipText:#174ea6;--soft:#f8fafc;
  --btn-bg:#fff;--btn-text:#172033;
}
html.force-light body{background:#ffffff!important;color:#000000!important}

html.force-light button{background:var(--btn-bg)!important;color:var(--btn-text)!important;border-color:#e5e7eb!important}
html.force-light #settingsBtn{background:transparent!important;border:none!important;color:#ffffff!important}
html.force-light .search-card{background-color:#ffffff!important;border-color:#e5e7eb!important}
html.force-light .toc,html.force-light summary,html.force-light details.category,html.force-light .quick-card,html.force-light ul{background-color:#ffffff!important;border-color:#e5e7eb!important}
html.force-light .toc-title{color:#111827!important}
html.force-light summary span{color:#000000!important}
html.force-light .quick-card h2{color:#000000!important}
html.force-light .site-link{border-bottom:0!important;text-decoration:none!important}
html.force-light .site-link strong{color:#0f4aa2!important}
html.force-light .feature{color:#7c3aed!important;background:#f3e8ff!important}
html.force-light .count{background:#f1f5f9!important;color:#475569!important}
html.force-light .toc a{background:#eef4ff!important;color:#174ea6!important}
html.force-light .toc a.mid-toc{background:#e8f5ee!important;color:#166534!important;border-color:#bbd9c8!important}
html.force-light .toc a.special-pink{background:#ffebeb!important;color:#c04848!important;box-shadow:0 2px 6px rgba(192,72,72,.15)!important}

html.force-light .mid-divider{color:#17365d!important}
html.force-light .mid-divider > span{background:#ffffff!important;border-color:#d5deeb!important}
html.force-light .mid-divider:before,html.force-light .mid-divider:after{background:linear-gradient(90deg,#17365d,#d9e3f0)!important}
html.force-light #scrollTopBtn{border-color:#061a34!important;background-color:#ffffff!important;color:#172033!important}

.mid-divider.hidden{display:none!important}
.hidden{display:none!important}
@media(max-width:900px){.toc-grid,.quick-row{grid-template-columns:1fr}}

/* [수정] 미디어 쿼리 내 미세하게 흔들림을 유발하던 요소를 수정했습니다. */
@media(max-width:760px){
  header{padding:24px 16px} 
  h1{font-size:24px} 
  /* 모바일 환경에서도 굳이 고정을 풀지 않고 sticky 상태를 유지하여 화면 팅김 현상을 방지합니다. */
  .search-card{position:sticky; top: 0;} 
  .grid{grid-template-columns:1fr} 
  ul{columns:1} 
  .section-divider{font-size:24px} 
  .section-divider.news-divider{font-size:18px}
}

#scrollTopBtn {
  display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99;
  width: 52px; height: 52px; /* 글자가 들어가므로 크기를 조금 키웠습니다 */
  background-color: var(--card); /* 카드 색상과 동일하게 설정 */

// 화면 모드 전환 기능 구현 스크립트
function toggleSettingsPopup() {
  const popup = document.getElementById('settingsPopup');
  popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
}
// 외부 클릭 시 팝업 닫기
document.addEventListener('click', function(e) {
  const popup = document.getElementById('settingsPopup');
  const btn = document.getElementById('settingsBtn');
  if (popup && popup.style.display === 'block' && !popup.contains(e.target) && e.target !== btn) {
    popup.style.display = 'none';
  }
});
function changeThemeMode(mode) {
  localStorage.setItem('site-theme-mode', mode);
  applyThemeMode(mode);
}
function applyThemeMode(mode) {
  const rootHtml = document.documentElement;
  const effectiveMode = mode === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : mode;
  rootHtml.classList.toggle('force-light', effectiveMode === 'light');
  rootHtml.classList.toggle('force-dark', effectiveMode === 'dark');
  rootHtml.dataset.themeMode = mode;
  rootHtml.dataset.effectiveTheme = effectiveMode;
  document.querySelectorAll('#settingsPopup .theme-option').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.themeMode === mode);
    btn.setAttribute('aria-pressed', btn.dataset.themeMode === mode ? 'true' : 'false');
  });
}
// 페이지 로드 시 기존 설정 불러오기
document.addEventListener('DOMContentLoaded', function() {
  const savedMode = localStorage.getItem('site-theme-mode') || 'auto';
  applyThemeMode(savedMode);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem('site-theme-mode') || 'auto') === 'auto') applyThemeMode('auto');
    });
  }

function slug(prefix,s){return prefix+'-'+s.replace(/[^가-힣a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'')}
function label(cat,map){return `${map[cat] || '🔹'} ${tocDisplayName(cat)}`}
function cleanName(name){return String(name).replace(/[📈💹🪙]$/,'').split(' - ')[0].trim()}
function safeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function displayName(name){
  const raw=String(name).trim();
  const m=raw.match(/^(.*?)\s+-\s+(\(.*\)|.*)$/);
  if(!m) return safeHtml(raw);
  return safeHtml(m[1]) + '<span class="feature">' + safeHtml(m[2]) + '</span>';
}
function safeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function summaryText(name,url,cat){
  const n=cleanName(name);
  if(descriptions[n]) return descriptions[n];
  const c = cat || '일반';
  if(/경제|비즈|파이낸셜|이코노|마켓|블룸버그|CNBC|WSJ|월스트리트|파이낸스|증시|투자/.test(n+c)) return `${n}: ${c} 분야의 경제·비즈니스·시장 정보 링크. 기업·산업·투자 흐름 확인에 유용.`;
  if(/신문|일보|뉴스|통신|저널|타임스|포스트|프레스|데일리/.test(n)) return `${n}: ${c} 분야의 뉴스 매체. 발행지역·창간일·소유구조는 공식 소개 자료에서 확인하는 것이 정확함.`;
  if(/cafe\.naver|dcinside|fmkorea|theqoo|clien|ppomppu|ruliweb/.test(url)) return `${n}: ${c} 관련 커뮤니티/포럼. 이용자층과 게시판 문화가 강하게 반영되는 링크.`;
  return `${n}: ${c} 분야 참고 링크. 공식 사이트 기준으로 운영 주체·발행 지역·전문 분야를 확인할 수 있음.`;
}
function linkHtml(item,cat){const [name,url]=item;return `<a class="site-link" data-text="${safeAttr((name+' '+url+' '+cat).toLowerCase())}" href="${safeAttr(url)}" target="_blank" rel="noopener noreferrer"><strong>${displayName(name)}</strong><span class="url">${url}</span></a>`}
function tocDisplayName(text){
  const original = String(text || '');
  return original
    .replace(/뉴스/g,'')
    .replace(/포럼/g,'')
    .replace(/신문/g,'')
    .replace(/\s{2,}/g,' ')
    .replace(/\s+\)/g,')')
    .replace(/\(\s+/g,'(')
    .replace(/\s*·\s*/g,' · ')
    .replace(/^\s+|\s+$/g,'') || original;
}
function tocLabel(cat,map){
  const emoji = map[cat] || '🔹';
  return `${emoji} ${tocDisplayName(cat)}`;
}
function tocHtml(items,prefix,map){
  return items.map((d)=>{
    if(d.type==='divider') return `<a class="mid-toc toc-main" href="#${slug(prefix,'mid-'+d.title)}">${tocDisplayName(d.title)}</a>`;
    return `<a href="#${slug(prefix,d.cat)}">${tocLabel(d.cat,map)}</a>`;
  }).join('')
}
function portalTocHtml(){
  return `<div class="toc-group"><a class="mid-toc toc-main" href="#news-start">포털/속보</a><a href="#portal">🌐 포털뉴스</a><a href="#breaking">⚡ 속보</a></div>`;
}
function renderSection(items, prefix, map, container){
  let openCount = 0;
  container.innerHTML = items.map((d)=>{
    if(d.type==='divider') return `<div class="mid-divider search-divider mid-divider-toggle" id="${slug(prefix,'mid-'+d.title)}" data-section="${prefix}" data-text="${safeAttr((d.title||'').toLowerCase())}" role="button" tabindex="0" aria-expanded="true" title="눌러서 접기/펼치기"><span>📂 ${tocDisplayName(d.title)}<span class="mid-toggle-icon">▾</span></span></div>`;
    const openAttr = openCount++ < 12 ? 'open' : '';
    return `<details class="category" data-section="${prefix}" data-text="${safeAttr((d.cat+' '+d.links.map(x=>x.join(' ')).join(' ')).toLowerCase())}" id="${slug(prefix,d.cat)}" ${openAttr}><summary><span>${label(d.cat,map)}</span></summary><ul>${d.links.map(x=>`<li>${linkHtml(x,d.cat)}</li>`).join('')}</ul></details>`;
  }).join('')
}
function render(){
  /* 기존 두 개를 없애고 합쳐진 육각형 파스텔 핑크 버튼 하나로 대체하여 포털/속보 위치로 이동하게 링크 */
  if(newsToc) newsToc.innerHTML = portalTocHtml() + tocHtml(newsData,'news',newsEmoji);
  if(forumToc) forumToc.innerHTML = tocHtml(forumData,'forum',forumEmoji);
  if(portalLinks) portalLinks.innerHTML = portalData.map(x=>linkHtml(x,'포털뉴스')).join('');
  if(breakingLinks) breakingLinks.innerHTML = breakingData.map(x=>linkHtml(x,'속보')).join('');
  if(newsTree) renderSection(newsData,'news',newsEmoji,newsTree);
  if(forumTree) renderSection(forumData,'forum',forumEmoji,forumTree);
}

function findPreviousMidDivider(el){
  let prev = el ? el.previousElementSibling : null;
  while(prev){
    if(prev.matches && prev.matches('.mid-divider')) return prev;
    prev = prev.previousElementSibling;
  }
  return null;
}
function setMidDividerState(divider, expanded){
  if(!divider) return;
  divider.classList.toggle('is-collapsed', !expanded);
  divider.setAttribute('aria-expanded', String(expanded));
  const icon = divider.querySelector('.mid-toggle-icon');
  if(icon) icon.textContent = expanded ? '▾' : '▸';
  let next = divider.nextElementSibling;
  while(next && !next.matches('.mid-divider')){
    if(next.matches('details.category')){
      next.classList.toggle('collapsed-by-divider', !expanded);
    }
    next = next.nextElementSibling;
  }
}
function toggleMidDivider(divider){
  const expanded = divider.getAttribute('aria-expanded') !== 'false';
  setMidDividerState(divider, !expanded);
}
function expandParentMidDivider(el){
  const parentDivider = findPreviousMidDivider(el);
  if(parentDivider) setMidDividerState(parentDivider, true);
}
function expandAllMidDividers(scope=document){
  scope.querySelectorAll('.mid-divider').forEach(divider=>setMidDividerState(divider, true));
}
function collapseAllMidDividers(scope=document){
  scope.querySelectorAll('.mid-divider').forEach(divider=>setMidDividerState(divider, false));
}
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('details.category').forEach(el=>{
    const hit=!q || el.dataset.text.includes(q) || Array.from(el.querySelectorAll('a')).some(a=>(a.dataset.text||'').includes(q));
    el.classList.toggle('hidden', !hit);
    if(q && hit){
      expandParentMidDivider(el);
      el.classList.remove('collapsed-by-divider');
      el.open=true;
    }
  });
  document.querySelectorAll('.search-divider').forEach(el=>{el.classList.toggle('hidden', !!q);});
  document.querySelectorAll('.quick-card').forEach(card=>{
    if(!q){card.classList.remove('hidden');return;}
    const text=(card.dataset.text+' '+Array.from(card.querySelectorAll('a')).map(a=>a.dataset.text||a.textContent).join(' ')).toLowerCase();
    card.classList.toggle('hidden', !text.includes(q));
  });
}
function openAll(){
  expandAllMidDividers();
  document.querySelectorAll('details.category').forEach(d=>{d.classList.remove('collapsed-by-divider'); d.open=true;});
}
function closeAll(){
  collapseAllMidDividers();
  document.querySelectorAll('details.category').forEach(d=>d.open=false);
}
document.getElementById('q').addEventListener('input', filter);
render();

function revealShortcutTarget(target){
  if(!target) return;
  target.classList.remove('hidden');

  if(target.matches('details.category')){
    expandParentMidDivider(target);
    target.classList.remove('collapsed-by-divider');
    target.open = true;
  }

  if(target.matches('.mid-divider')){
    setMidDividerState(target, true);
    let next = target.nextElementSibling;
    while(next && !next.matches('.mid-divider')){
      if(next.matches('details.category')){
        next.classList.remove('hidden', 'collapsed-by-divider');
        next.open = true;
      }
      next = next.nextElementSibling;
    }
  }

  if(target.matches('#forum-start')){
    expandAllMidDividers(document.getElementById('forumTree'));
    document.querySelectorAll('#forumTree details.category').forEach(d=>{
      d.classList.remove('hidden', 'collapsed-by-divider');
      d.open = true;
    });
  }

  if(target.matches('#news-start')){
    expandAllMidDividers(document.getElementById('newsTree'));
    document.querySelectorAll('#portal, #breaking, #newsTree details.category').forEach(el=>{
      el.classList.remove('hidden');
      if(el.matches('details.category')){
        el.classList.remove('collapsed-by-divider');
        el.open = true;
      }
    });
  }
}

function markShortcutTarget(target){
  document.querySelectorAll('.anchor-active').forEach(el=>el.classList.remove('anchor-active'));
  target.classList.add('anchor-active');
  window.setTimeout(()=>target.classList.remove('anchor-active'), 1700);
}

function moveToShortcutTarget(target, updateHash=true){
  revealShortcutTarget(target);
  target.scrollIntoView({behavior:'smooth', block:'start'});
  markShortcutTarget(target);
  if(updateHash && target.id){
    history.replaceState(null, '', '#' + encodeURIComponent(target.id));
  }
}

document.addEventListener('click', function(e){
  const midToggle = e.target.closest('.mid-divider-toggle');
  if(midToggle){
    e.preventDefault();
    toggleMidDivider(midToggle);
    return;
  }

  const toggle = e.target.closest('.toc-toggle');
  if(toggle){
    const panel = document.getElementById(toggle.dataset.panel);
    if(!panel) return;
    e.preventDefault();
    const willCollapse = !panel.classList.contains('is-collapsed');
    panel.classList.toggle('is-collapsed', willCollapse);
    toggle.setAttribute('aria-expanded', String(!willCollapse));
    const icon = toggle.querySelector('.toc-toggle-icon');
    if(icon) icon.textContent = willCollapse ? '펼치기' : '접기';
    return;
  }

  const trigger = e.target.closest('#newsToc a, #forumToc a');
  if(!trigger) return;

  const href = trigger.getAttribute('href') || '';
  const targetId = href.startsWith('#') ? decodeURIComponent(href.slice(1)) : '';
  const target = document.getElementById(targetId);
  if(!target) return;

  e.preventDefault();
  moveToShortcutTarget(target, true);
});


document.addEventListener('keydown', function(e){
  const midToggle = e.target.closest('.mid-divider-toggle');
  if(!midToggle) return;
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    toggleMidDivider(midToggle);
  }
});

window.addEventListener('hashchange', function(){
  const targetId = decodeURIComponent(location.hash.replace(/^#/, ''));
  const target = document.getElementById(targetId);
  if(target) moveToShortcutTarget(target, false);
});

if(location.hash){
  window.setTimeout(()=>{
    const target = document.getElementById(decodeURIComponent(location.hash.replace(/^#/, '')));
    if(target) moveToShortcutTarget(target, false);
  }, 50);
}

<script>
/* Home v3.3: consistent popup toggling */
(function(){
  function popup(id){ return document.getElementById(id); }
  function show(el){ if(el) el.style.display='block'; }
  function hide(el){ if(el) el.style.display='none'; }
  function isOpen(el){ return !!el && el.style.display === 'block'; }

  window.toggleSettingsPopup = function(){
    const settings = popup('settingsPopup');
    const font = popup('fontPopup');
    const willOpen = !isOpen(settings);
    hide(font);
    if(settings) settings.style.display = willOpen ? 'block' : 'none';
  };

  window.toggleFontPopup = function(){
    const settings = popup('settingsPopup');
    const font = popup('fontPopup');
    const willOpen = !isOpen(font);
    hide(settings);
    if(font) font.style.display = willOpen ? 'block' : 'none';
  };

  document.addEventListener('click', function(e){
    const settings = popup('settingsPopup');
    const font = popup('fontPopup');
    const settingsBtn = document.getElementById('settingsBtn');
    const fontBtn = document.getElementById('fontBtn');

    const inSettings = settings && settings.contains(e.target);
    const inFont = font && font.contains(e.target);
    const onSettingsBtn = settingsBtn && (e.target === settingsBtn || settingsBtn.contains(e.target));
    const onFontBtn = fontBtn && (e.target === fontBtn || fontBtn.contains(e.target));

    if(!inSettings && !onSettingsBtn && isOpen(settings)) hide(settings);
    if(!inFont && !onFontBtn && isOpen(font)) hide(font);
  }, true);
})();
</script>


<script>
/* Home v3.8: popup alignment under each clicked setting button */
(function(){
  function byId(id){return document.getElementById(id);}
  function isOpen(el){return !!el && el.style.display === 'block';}
  function hide(el){if(el) el.style.display = 'none';}
  function placePopup(popup, btn){
    if(!popup || !btn) return;
    const anchor = document.querySelector('.ry-titlebar,.header-inner') || btn.offsetParent || document.body;
    const a = anchor.getBoundingClientRect();
    const b = btn.getBoundingClientRect();
    popup.style.position = 'absolute';
    popup.style.top = '100%';
    popup.style.left = 'auto';
    popup.style.right = Math.max(0, Math.round(a.right - b.right)) + 'px';
    popup.style.marginTop = '8px';
  }
  window.toggleSettingsPopup = function(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    const btn = byId('settingsBtn');
    const willOpen = !isOpen(settings);
    hide(font);
    if(settings){
      placePopup(settings, btn);
      settings.style.display = willOpen ? 'block' : 'none';
    }
  };
  window.toggleFontPopup = function(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    const btn = byId('fontBtn');
    const willOpen = !isOpen(font);
    hide(settings);
    if(font){
      placePopup(font, btn);
      font.style.display = willOpen ? 'block' : 'none';
    }
  };
  window.addEventListener('resize', function(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    if(isOpen(settings)) placePopup(settings, byId('settingsBtn'));
    if(isOpen(font)) placePopup(font, byId('fontBtn'));
  }, {passive:true});
})();
</script>


<script>
/* Home v3.10: cycle buttons instead of popups */
(function(){
  const THEME_ORDER = ['auto','light','dark'];
  const FONT_ORDER = [1,1.2,0.8];
  const EPS = 0.001;

  function byId(id){ return document.getElementById(id); }
  function normScale(v){
    const n = parseFloat(v);
    if(Number.isNaN(n)) return 1;
    if(n >= 1.05) return 1.2;
    if(n <= 0.95) return 0.8;
    return 1;
  }
  function percent(scale){ return Math.round(normScale(scale) * 100) + '%'; }
  function readTheme(){ return localStorage.getItem('site-theme-mode') || 'auto'; }
  function readScale(){ return normScale(localStorage.getItem('site-font-scale') || getComputedStyle(document.documentElement).getPropertyValue('--site-font-scale') || 1); }

  function hideLegacyPopups(){
    const settings = byId('settingsPopup');
    const font = byId('fontPopup');
    if(settings) settings.style.display = 'none';
    if(font) font.style.display = 'none';
  }

  function refreshThemeButton(mode){
    const btn = byId('settingsBtn');
    if(!btn) return;
    const current = mode || readTheme();
    const labelMap = {auto:'시스템모드', light:'수동밝게모드', dark:'수동다크모드'};
    const iconMap = {auto:'💻', light:'☀️', dark:'🌙'};
    btn.textContent = iconMap[current] || iconMap.auto;
    btn.setAttribute('aria-label', '밝기설정: ' + (labelMap[current] || labelMap.auto));
    btn.setAttribute('title', '밝기설정: ' + (labelMap[current] || labelMap.auto));
    btn.dataset.themeMode = current;
  }

  function refreshFontButton(scale){
    const btn = byId('fontBtn');
    if(!btn) return;
    const p = percent(scale == null ? readScale() : scale);
    btn.textContent = 'Aa ' + p;
    btn.setAttribute('aria-label', '폰트크기설정: ' + p);
    btn.setAttribute('title', '폰트크기설정: ' + p);
    btn.dataset.fontScale = String(normScale(scale == null ? readScale() : scale));
  }

  function applyMode(mode){
    const next = THEME_ORDER.includes(mode) ? mode : 'auto';
    if(typeof window.applyThemeMode === 'function'){
      window.applyThemeMode(next);
    }else{
      const dark = next === 'dark' || (next === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const light = !dark;
      document.documentElement.classList.toggle('force-dark', dark);
      document.documentElement.classList.toggle('force-light', light);
      document.documentElement.dataset.themeMode = next;
      document.documentElement.dataset.effectiveTheme = dark ? 'dark' : 'light';
    }
    localStorage.setItem('site-theme-mode', next);
    refreshThemeButton(next);
    hideLegacyPopups();
  }

  function applyScale(scale){
    const next = normScale(scale);
    if(typeof window.setFontSize === 'function'){
      window.setFontSize(next);
    }else{
      document.documentElement.style.setProperty('--site-font-scale', next);
      localStorage.setItem('site-font-scale', next);
    }
    refreshFontButton(next);
    hideLegacyPopups();
  }

  window.toggleSettingsPopup = function(){
    const current = readTheme();
    const idx = Math.max(0, THEME_ORDER.indexOf(current));
    applyMode(THEME_ORDER[(idx + 1) % THEME_ORDER.length]);
  };

  window.toggleFontPopup = function(){
    const current = readScale();
    let idx = FONT_ORDER.findIndex(v => Math.abs(v - current) < EPS);
    if(idx < 0) idx = 0;
    applyScale(FONT_ORDER[(idx + 1) % FONT_ORDER.length]);
  };

  window.changeThemeMode = function(mode){ applyMode(mode); };
  window.changeFontSize = function(scale){ applyScale(scale); };

  function init(){
    hideLegacyPopups();
    applyMode(readTheme());
    applyScale(readScale());
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = () => {
      if(readTheme() === 'auto') applyMode('auto');
    };
    if(mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if(mq.addListener) mq.addListener(onSystemChange);
  }
})();
</script>
